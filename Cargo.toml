[package]
name = "apfs-writer"
version = "0.1.0"
edition = "2021"
description = "Minimal APFS container/volume writer for iOS restore ramdisks (Linux)"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tar = "0.4"
flate2 = "1"
libc = "0.2"
xattr = "1.7"

[dev-dependencies]
sha2 = "0.10"
